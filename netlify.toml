[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_EMAILJS_PUBLIC_KEY,VITE_EMAILJS_SERVICE_ID,VITE_EMAILJS_TEMPLATE_ID,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL,GOOGLE_ALLOWED_EMAILS,SESSION_SECRET,NAS_BASE_URL,NAS_USER,NAS_PASS,IMAGE_LIST_URL,PORT"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,.env.local,README.md"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
